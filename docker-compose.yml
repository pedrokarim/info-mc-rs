services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - PORT=3001
      - RUST_LOG=info
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - IP_HASH_SALT=${IP_HASH_SALT:-}
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-4060}:3000"
    environment:
      - API_BASE_INTERNAL=http://api:3001
      - PUBLIC_API_BASE=
      - PORT=3000
      - ORIGIN=http://localhost:${WEB_PORT:-3000}
      # Mesure d'audience. Lues à l'exécution par `$env/dynamic/public`, donc
      # inutile de reconstruire l'image pour les changer : un
      # `docker compose up -d --no-deps web` suffit. Jeton vide = aucune
      # collecte et aucune requête.
      - PUBLIC_SARUTOBI_PROJECT_TOKEN=${PUBLIC_SARUTOBI_PROJECT_TOKEN:-}
      - PUBLIC_SARUTOBI_ENVIRONMENT=${PUBLIC_SARUTOBI_ENVIRONMENT:-production}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
